# ==============================================
# Cardnect Backend Application Configuration
# ==============================================

spring.application.name=cardnect-backend

# Server
server.port=8080

# ==============================================
# Appwrite Database Configuration
# ==============================================
appwrite.endpoint=${APPWRITE_ENDPOINT:https://sgp.cloud.appwrite.io/v1}
appwrite.project.id=${APPWRITE_PROJECT_ID}
appwrite.api.key=${APPWRITE_API_KEY}
appwrite.database.id=${APPWRITE_DATABASE_ID:cardnect}

# ==============================================
# Custom Auth / JWT Configuration
# ==============================================
auth.jwt.secret=${AUTH_JWT_SECRET:ZmFrZS1jaGFuZ2UtbWUtdG8tYS1wcm9wZXItMzItYnl0ZS1taW5pbXVtLXNlY3JldA==}
auth.jwt.expiration-minutes=${AUTH_JWT_EXPIRATION_MINUTES:10080}
auth.otp.bypass=${AUTH_DEV_BYPASS_OTP:${AUTH_OTP_BYPASS:true}}

# ==============================================
# Resend Email Configuration
# ==============================================
resend.enabled=${RESEND_ENABLED:false}
resend.api-key=${RESEND_API_KEY:}
resend.from-email=${RESEND_FROM_EMAIL:no-reply@cardnect.app}

# Frontend base URL — used for email CTA links
app.base-url=${APP_BASE_URL:http://localhost:5173}

# ==============================================
# CORS Configuration
# ==============================================
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:80}

# ==============================================
# Logging
# ==============================================
logging.level.root=INFO
logging.level.com.cardnect=DEBUG
logging.level.org.springframework.security=WARN
logging.level.org.hibernate.SQL=WARN

# ==============================================
# WhatsApp Meta Configuration
# ==============================================
whatsapp.enabled=${WHATSAPP_ENABLED:true}
whatsapp.token=${WHATSAPP_TOKEN:}
whatsapp.phone-id=${WHATSAPP_PHONE_ID:}
whatsapp.business-id=${WHATSAPP_BUSINESS_ID:}
whatsapp.webhook-token=${WHATSAPP_WEBHOOK_TOKEN:}
